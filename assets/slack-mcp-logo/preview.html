<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>yt-slack-mcp logo concepts</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 40px; background: #111827; color: #e5e7eb; font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 28px; color: #9ca3af; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
  .card { background: #1f2937; border: 1px solid #374151; border-radius: 16px; padding: 20px; }
  .card img.big { width: 100%; aspect-ratio: 1; display: block; }
  .card .name { margin-top: 12px; font-weight: 600; }
  .sizes { display: flex; align-items: end; gap: 16px; margin-top: 14px; color: #6b7280; }
  .sizes span { font-size: 11px; }
  .sizes img.s { width: 32px; height: 32px; }
  .sizes img.m { width: 64px; height: 64px; }
  .light { background: #f3f4f6; }
</style>
<h1>yt-slack-mcp — logo concepts</h1>
<p>Flat SVG, 512×512, no gradients or text. Check the 32 px versions for legibility.</p>
<div class="grid">
  <div class="card"><img class="big" src="01-threads.svg" alt=""><div class="name">01 — Threads</div>
    <div class="sizes"><img class="s" src="01-threads.svg" alt="32 px"><img class="m" src="01-threads.svg" alt="64 px"></div></div>
  <div class="card"><img class="big" src="02-channel.svg" alt=""><div class="name">02 — Channel</div>
    <div class="sizes"><img class="s" src="02-channel.svg" alt="32 px"><img class="m" src="02-channel.svg" alt="64 px"></div></div>
  <div class="card"><img class="big" src="03-link.svg" alt=""><div class="name">03 — Link</div>
    <div class="sizes"><img class="s" src="03-link.svg" alt="32 px"><img class="m" src="03-link.svg" alt="64 px"></div></div>
  <div class="card"><img class="big" src="04-node.svg" alt=""><div class="name">04 — Node</div>
    <div class="sizes"><img class="s" src="04-node.svg" alt="32 px"><img class="m" src="04-node.svg" alt="64 px"></div></div>
</div>
</html>
